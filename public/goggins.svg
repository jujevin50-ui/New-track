<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>

  <!-- Bandana (flag-style, wraps top of head) -->
  <path d="M38 18 Q50 7 62 18 Q57 12 50 11 Q43 12 38 18Z" fill="#0f0703"/>
  <!-- Bandana tail (right side) -->
  <path d="M62 18 L70 13 L68 21 L61 20Z" fill="#0f0703"/>
  <!-- Flag stripes on bandana -->
  <path d="M40 15 Q50 9 60 15" stroke="#cc2200" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M39 17 Q50 11 61 17" stroke="#cc2200" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Head -->
  <circle cx="50" cy="23" r="11.5" fill="#1a0d05"/>

  <!-- Sunglasses -->
  <rect x="40" y="20" width="8" height="4" rx="2" fill="#0a0604" opacity="0.9"/>
  <rect x="51" y="20" width="8" height="4" rx="2" fill="#0a0604" opacity="0.9"/>
  <line x1="48" y1="22" x2="51" y2="22" stroke="#0a0604" stroke-width="1"/>

  <!-- Neck (thick) -->
  <rect x="46" y="33.5" width="8" height="7" fill="#1a0d05"/>

  <!-- Shoulders + torso (one connected silhouette mass) -->
  <path d="M38 40 L62 40 L67 52 L63 78 L37 78 L33 52 Z" fill="#1a0d05"/>

  <!-- Left arm (massive) -->
  <path d="M38 40 L33 52 Q24 62 20 75 Q18 84 25 86 Q32 87 34 78 Q37 66 41 54 L38 40Z" fill="#1a0d05"/>

  <!-- Right arm -->
  <path d="M62 40 L67 52 Q76 62 80 75 Q82 84 75 86 Q68 87 66 78 Q63 66 59 54 L62 40Z" fill="#1a0d05"/>

  <!-- Tank top tear/rip detail (iconic) -->
  <path d="M47 68 Q50 72 53 68" stroke="#0f0703" stroke-width="1.5" fill="none"/>

  <!-- Race bib -->
  <rect x="41" y="50" width="18" height="15" rx="2" fill="#f0ede8"/>
  <text x="50" y="61.5" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="8.5" font-weight="900" fill="#0f0703">88</text>

  <!-- Shorts -->
  <path d="M35 77 L37 78 L63 78 L65 77 L65 90 Q60 92 50 92 Q40 92 35 90 Z" fill="#0f0703"/>

  <!-- Left leg -->
  <path d="M35 90 Q32 95 31 100 L40 100 Q40 95 42 90Z" fill="#1a0d05"/>

  <!-- Right leg -->
  <path d="M65 90 Q68 95 69 100 L60 100 Q60 95 58 90Z" fill="#1a0d05"/>

  <!-- Watch (right wrist detail) -->
  <rect x="77" y="74" width="6" height="4" rx="1" fill="#555" opacity="0.8"/>
</svg>
