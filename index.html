<!doctype html>
<html lang="en">
  <head>
    <script>
      // Thème sombre par défaut (appliqué avant le premier affichage : pas de flash blanc).
      try { if (localStorage.getItem('trading-journal-mode') !== 'light') document.documentElement.classList.add('dark'); }
      catch (e) { document.documentElement.classList.add('dark'); }
    </script>
    <style>html.dark { background: #000; color-scheme: dark; }</style>
    <script>
      // When a new service worker takes over (skipWaiting + clientsClaim on
      // deploy), reload so the page picks up the freshly built assets instead
      // of staying on a stale shell that references removed JS/CSS chunks.
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
