<!doctype html>
<html lang="en">
  <head>
    <script>
      // When a new service worker takes over (skipWaiting + clientsClaim on
      // deploy), reload so the page picks up the freshly built assets instead
      // of staying on a stale shell that references removed JS/CSS chunks.
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
